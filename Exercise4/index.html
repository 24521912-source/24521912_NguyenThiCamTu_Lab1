<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 4 - Resilient Component</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="page-header">
        <h1>Developer Resources</h1>
        <p>Exercise 4 - Resilient Component Architecture</p>
    </header>


    <main>

        <section aria-labelledby="resources-title">

            <header class="section-header">

                <h2 id="resources-title">
                    Resources
                </h2>

                <nav
                    class="state-controls"
                    aria-label="Component state controls"
                >

                    <button
                        type="button"
                        data-state="loading"
                    >
                        Loading
                    </button>

                    <button
                        type="button"
                        data-state="success"
                    >
                        Live Data
                    </button>

                    <button
                        type="button"
                        data-state="empty"
                    >
                        Empty
                    </button>

                    <button
                        type="button"
                        data-state="error"
                    >
                        Error
                    </button>

                </nav>

            </header>


            <section
                id="component"
                class="component"
                aria-live="polite"
            >
            </section>

        </section>

    </main>


    <script src="./script.js"></script>

</body>

</html>
