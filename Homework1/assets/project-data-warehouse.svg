<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Sales analytics star schema concept</title>
  <desc id="description">A central sales fact table connects to customer, product, and date dimensions for analytics.</desc>
  <rect width="800" height="520" fill="#2b1822"/>
  <circle cx="766" cy="38" r="137" fill="#482b39"/>
  <circle cx="28" cy="499" r="127" fill="#482b39"/>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="65" fill="#efb0c4" font-size="24" font-weight="700" letter-spacing="3">DATA WAREHOUSE</text>
    <text x="48" y="119" fill="#fff4f7" font-size="40" font-weight="700">Designed for questions.</text>
    <g fill="none" stroke="#efb0c4" stroke-width="4">
      <path d="M 230 250 H 280 M 520 250 H 570 M 400 330 V 382"/>
    </g>
    <g fill="#3c2230" stroke="#b47b8e" stroke-width="2">
      <rect x="40" y="196" width="190" height="108" rx="20"/>
      <rect x="570" y="196" width="190" height="108" rx="20"/>
      <rect x="305" y="382" width="190" height="100" rx="20"/>
    </g>
    <g fill="#e6bdca" font-size="21" text-anchor="middle">
      <text x="135" y="233">DIMENSION</text>
      <text x="665" y="233">DIMENSION</text>
      <text x="400" y="419">DIMENSION</text>
    </g>
    <g fill="#fff4f7" font-size="30" font-weight="600" text-anchor="middle">
      <text x="135" y="274">Customer</text>
      <text x="665" y="274">Product</text>
      <text x="400" y="458">Date</text>
    </g>
    <rect x="280" y="190" width="240" height="140" rx="24" fill="#efb0c4"/>
    <g fill="#2b1822" text-anchor="middle">
      <text x="400" y="231" font-size="22" font-weight="600" letter-spacing="2">FACT TABLE</text>
      <text x="400" y="275" font-size="36" font-weight="700">Sales</text>
      <text x="400" y="309" font-size="23">Quantity · Revenue</text>
    </g>
    <g fill="#efb0c4">
      <circle cx="253" cy="250" r="6"/>
      <circle cx="547" cy="250" r="6"/>
      <circle cx="400" cy="356" r="6"/>
    </g>
  </g>
</svg>
