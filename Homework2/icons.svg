<svg xmlns="http://www.w3.org/2000/svg">
  <!-- One symbol per drum sound. Stroke uses currentColor so CSS sets the colour. -->

  <symbol id="kick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="11" r="8.5"/>
    <circle cx="12" cy="11" r="3.5"/>
    <path d="M6 20.5 4.5 23M18 20.5l1.5 2.5"/>
  </symbol>

  <symbol id="snare" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 1.5l6 8M19 1.5l-6 8"/>
    <ellipse cx="12" cy="12" rx="8.5" ry="3"/>
    <path d="M3.5 12v6.5c0 1.7 3.8 3 8.5 3s8.5-1.3 8.5-3V12"/>
    <path d="M3.5 15.5l2.8 3 2.9-3 2.8 3 2.8-3 2.9 3 2.8-3"/>
  </symbol>

  <symbol id="hihat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v3"/>
    <path d="M3 9c2-2.5 16-2.5 18 0z"/>
    <path d="M3 10.5c2 2.5 16 2.5 18 0z"/>
    <path d="M12 13v8.5M8 21.5h8"/>
  </symbol>

  <symbol id="openhat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 1.5v3"/>
    <path d="M3 7c2-2.5 16-2.5 18 0z"/>
    <path d="M3 12c2 2.5 16 2.5 18 0z"/>
    <path d="M12 14.5v7M8 21.5h8"/>
    <path d="M1 9.5h1.5M21.5 9.5H23"/>
  </symbol>

  <symbol id="clap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="9" width="7" height="13" rx="3.5" transform="rotate(-18 8 15.5)"/>
    <rect x="12.5" y="9" width="7" height="13" rx="3.5" transform="rotate(18 16 15.5)"/>
    <path d="M12 1.5v3.5M6.5 3l1.8 2.7M17.5 3l-1.8 2.7"/>
  </symbol>

  <symbol id="tom-low" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="9.5" ry="3"/>
    <path d="M2.5 7v11c0 1.7 4.3 3 9.5 3s9.5-1.3 9.5-3V7"/>
    <path d="M9 13l3 3 3-3"/>
  </symbol>

  <symbol id="tom-high" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="7" rx="6.5" ry="2.5"/>
    <path d="M5.5 7v12c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5V7"/>
    <path d="M9 16l3-3 3 3"/>
  </symbol>

  <symbol id="ride" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.5 9c3-3 18-3 21 0z"/>
    <path d="M10 6.8a2 2 0 0 1 4 0"/>
    <path d="M12 10.5v11M8 21.5h8"/>
  </symbol>

  <symbol id="crash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 13.5c2.4-3.8 15.5-7.3 18.5-4.8z"/>
    <path d="M12 12v9.5M8 21.5h8"/>
    <path d="M2 4l2.2 2.2M12 1.5v3M22 4l-2.2 2.2"/>
  </symbol>
</svg>
